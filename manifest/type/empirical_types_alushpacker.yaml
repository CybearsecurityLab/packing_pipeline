  pipeline_evidence: '2 distinct payloads x 3 reps, certified backend (plugin 50a5aa94...):
    every run exec_events=0 with paper_termination_reason=no_execution_launch_failed,
    sample_started=false and root_entry_seen=false, while the launcher''s own PACK markers
    still fired (marker_callback_hits 7-10). The process image is created and mapped but
    not one basic block executes. ROOT CAUSE IS THE GUEST, NOT THE PACKER: the packed
    output is a structurally valid PE32 (entrypoint RVA 0x273c inside .text, all sections
    within SizeOfImage, no TLS directory), and it imports VCRUNTIME140.dll plus the
    api-ms-win-crt-* API sets (AlushPacker Builder/builder.c:298-308 emits a precompiled
    MSVC-built stub, so every alushpacker output carries this dependency). The
    api-ms-win-crt-* imports resolve through the Win10 apiset schema to ucrtbase.dll,
    which is present; VCRUNTIME140.dll is not an API set and is absent from the guest --
    read-only nbd inspection of the staged image found no VCRUNTIME140.dll in System32 or
    SysWOW64 (only the .NET-private vcruntime140_clr0400.dll, which does not satisfy an
    import by that name) and only vc80/vc90 CRTs in WinSxS. The samples are PE32
    (machine 0x14c) on a 64-bit guest, so they need the x86 redistributable. The loader
    therefore fails import resolution before the entry point. This is retryable
    INFRASTRUCTURE and says nothing about the packer: alushpacker must NOT be treated as
    producing nonfunctional output, and must not be removed from the corpus on that basis.
    Corpus-wide scan of staged samples: alushpacker is the only affected packer. Fix is to
    install the x86 VC++ redistributable into the guest image; that touches no component of
    the backend identity pin (qemu, plugin, launcher, ntdll, kernel profile), so
    certification is preserved.'
